[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src/packages/aind_behavior_dynamic_foraging_curricula/tests",
]

[tool.uv.workspace]
members = [
    "src/packages/aind_behavior_dynamic_foraging",
    "src/packages/aind_behavior_dynamic_foraging_curricula",
    "src/packages/aind_behavior_dynamic_foraging_metadata_mapper",
]

[tool.uv.sources]
aind-behavior-dynamic-foraging = { workspace = true }
aind-behavior-dynamic-foraging-curricula = { workspace = true }
aind-behavior-dynamic-foraging-metadata-mapper = { workspace = true }

[dependency-groups]

dev = [
    "ruff",
    "codespell",
    "pytest",
    "pytest-cov",
    "aind-behavior-dynamic-foraging[data]",
    "aind-behavior-dynamic-foraging-metadata-mapper",
]

docs = [
    'Sphinx',
    'furo',
    'sphinx-jinja',
    'autodoc_pydantic[erdantic]',
    'myst_parser',
    'sphinx-jsonschema',
    'aind-behavior-dynamic-foraging[data]',
    'aind-behavior-dynamic-foraging-curricula',
]

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,*Generated.cs'
ignore-words-list = 'nd'

[tool.uv]
default-groups = ['dev']
required-version = '>=0.8.4'
